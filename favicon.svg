<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- An open book. Drawn as filled pages rather than thin strokes, because a
       favicon is read at 16px and hairlines disappear at that size. -->
  <g fill="#C4DBEF" stroke="#1B3A5C" stroke-width="2"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M16 9C13 6.4 8.6 5.6 4 6.4v18.2c4.6-.8 9-.1 12 2.5z"/>
    <path d="M16 9c3-2.6 7.4-3.4 12-2.6v18.2c-4.6-.8-9-.1-12 2.5z"/>
  </g>
  <path d="M16 9v18.1" fill="none" stroke="#1B3A5C" stroke-width="2"
        stroke-linecap="round"/>
</svg>
